name: Terraform validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt -check (root)
        run: terraform fmt -check -diff *.tf

      - name: terraform fmt -check (modules)
        run: terraform fmt -check -diff -recursive modules/

      - name: terraform fmt -check (examples)
        run: terraform fmt -check -diff -recursive examples/

  validate:
    name: terraform validate (modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform init && validate per module
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in modules/*/; do
            if [ -f "$dir/main.tf" ] || [ -f "$dir/versions.tf" ]; then
              # web-ui requires aws.us-east-1 provider alias supplied by the caller;
              # it is validated via the examples that wire it up.
              if [ "$dir" = "modules/web-ui/" ]; then
                echo "::notice::Skipping $dir (validated via examples)"
                continue
              fi
              echo "::group::Validating $dir"
              (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
              echo "::endgroup::"
            fi
          done

  tflint:
    name: tflint (modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint --init
        run: tflint --init

      - name: tflint per module
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in modules/*/; do
            if [ -f "$dir/main.tf" ] || [ -f "$dir/versions.tf" ]; then
              echo "::group::Linting $dir"
              if [ -f "$dir/.tflint.hcl" ]; then
                # Module ships its own config (e.g. processing-environment-api
                # disables a few aws-iam-policy rules that crash on plan-time
                # conditional ARNs). Use it.
                (cd "$dir" && tflint --minimum-failure-severity=error)
              else
                (cd "$dir" && tflint --minimum-failure-severity=error --config="$GITHUB_WORKSPACE/.tflint.hcl")
              fi
              echo "::endgroup::"
            fi
          done

  tfsec:
    name: tfsec (modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: tfsec per module
        # tfsec 1.28.x cannot parse Terraform 1.5+ check{} blocks used at the
        # repo root and in sagemaker-udop-processor/main.tf and
        # build-runtime-check/main.tf. --exclude-path at the root level still
        # parses these files first and aborts the scan, so we use
        # --ignore-hcl-errors alongside the exclude-paths. The root is not
        # scanned here; module scans cover the same code from the consumer side.
        #
        # soft_fail today: there are pre-existing findings unrelated to
        # this PR (DynamoDB encryption, S3 logging, IAM SID wildcards, ...).
        # Flip to soft_fail: false once the baseline is clean.
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: modules
          additional_args: --config-file ../.tfsec/config.yml --ignore-hcl-errors --exclude-path processors/sagemaker-udop-processor/main.tf --exclude-path build-runtime-check/main.tf
          soft_fail: true

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov

      - name: checkov
        run: |
          checkov --config-file .checkov.yml --quiet || true
        # Checkov is run in soft-fail today; flip to hard-fail once the
        # baseline is clean. Tracked in upgrade notes.
